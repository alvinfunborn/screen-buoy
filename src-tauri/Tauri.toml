identifier = "com.screen-buoy.dev"
version = "1.4.1"
productName = "screen-buoy"

[build]
beforeDevCommand = "npm run dev"
beforeBuildCommand = "npm run build"
devUrl = "http://localhost:1420"
frontendDist = ["../dist"] # v2 需要明确指定

[app]
macOSPrivateApi = true

[app.security]
capabilities = ["main-capability", "updater-capability"]

# # v2 需要显式设置 security
# [app.security]
# capabilities = [
#   "app-show", "app-hide",                    # 应用显隐
#   "window-show", "window-hide",              # 窗口显隐
#   "window-close", "window-set-focus", "window-start-dragging",  # 窗口操作
#   "process-exit", "process-relaunch",        # 进程控制
#   "global-shortcut-all",                     # 全局快捷键
#   "tray-icon",                              # 系统托盘
#   "event-all",                              # 替换原来的 event-listen 和 event-emit
#   "ipc-invoke",                             # IPC 调用
#   "devtools"                                # 开发工具
# ]
# # 如果需要用到 tauri-plugin-shell, 需要定义 shell scope
# # shell = { scope = [] }

[[app.windows]]
label = "main"
title = "Screen Buoy"
url = "index.html"
width = 960
height = 780
resizable = true
fullscreen = false
center = true
visible = false
# decorations = true # 根据需要设置
# transparent = false # 根据需要设置

[bundle]
active = true
targets = ["app"] # Release CI also builds an NSIS installer on Windows.
icon = [
  "icons/icon.icns", # macOS rounded icon with transparent margins
  "icons/icon.ico",
  "icons/icon.png",
]
copyright = "Copyright (c) 2025 alvinfunborn"
category = "DeveloperTool"
shortDescription = ""
longDescription = ""

# [bundle.deb]
# depends = []

[bundle.macOS]
minimumSystemVersion = "10.15"
exceptionDomain = ""

[bundle.windows]
# certificateThumbprint = null
digestAlgorithm = "sha256"
timestampUrl = ""
# wix = {} # 可选，用于 WiX 配置

[plugins.trayIcon]
iconPath = "icons/icon.png"
iconAsTemplate = false

[plugins.updater]
pubkey = "dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDY5QTc0NUE2QTJFRTBBMjQKUldRa0N1Nmlwa1duYWFoZTlMOWl2SGIxaXgzcnhvVzdzSGkzY2pCZHI3UmhKUWhqMkxlNnN0WDgK"
endpoints = ["https://github.com/alvinfunborn/screen-buoy/releases/latest/download/latest.json"]

[plugins.updater.windows]
installMode = "passive"
