<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44">
  <!-- macOS menu bar tray icon: 44x44 (@2x for 22pt) -->
  <!-- Three stacked cursors (no tail), tilted like Windows modern pointer -->

  <!-- Back cursor (bottom layer, most transparent) -->
  <polygon points="20,8 32,32 26,30 22,38 20,37 24,29 18,28" fill="white" opacity="0.3" transform="translate(6,0)"/>

  <!-- Middle cursor -->
  <polygon points="14,6 26,30 20,28 16,36 14,35 18,27 12,26" fill="white" opacity="0.6" transform="translate(3,0)"/>

  <!-- Front cursor (top layer, fully opaque) -->
  <polygon points="8,4 20,28 14,26 10,34 8,33 12,25 6,24" fill="white" opacity="1"/>
</svg>
