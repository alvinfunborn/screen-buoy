name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend & Tauri
        run: npm run build && npm run tauri build

      - name: Create screen-buoy.zip
        run: |
          Compress-Archive -Path src-tauri\target\release\screen-buoy.exe, src-tauri\config.toml -DestinationPath screen-buoy.zip -Force

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: screen-buoy.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
