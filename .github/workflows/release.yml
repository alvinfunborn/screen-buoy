name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Check language catalogs
        run: npm run test:i18n

      - name: Check release version
        run: npm run check:version

      - name: Build frontend & Tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Configure TAURI_SIGNING_PRIVATE_KEY before releasing' }
          npm run tauri build -- --bundles nsis --config src-tauri/tauri.updater.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run regression tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Create screen-buoy-windows.zip
        run: |
          Compress-Archive -Path src-tauri\target\release\screen-buoy.exe, src-tauri\config.toml -DestinationPath screen-buoy-windows.zip -Force
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe screen-buoy-windows-setup.exe
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe.sig screen-buoy-windows-setup.exe.sig

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            screen-buoy-windows.zip
            screen-buoy-windows-setup.exe
            screen-buoy-windows-setup.exe.sig
          if-no-files-found: error

  release-macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Check language catalogs
        run: npm run test:i18n

      - name: Check release version
        run: npm run check:version

      - name: Build frontend & Tauri
        env:
          # With no Developer ID credentials, produce an explicitly ad-hoc
          # signed universal app. See docs/macos-release.md for notarized builds.
          APPLE_SIGNING_IDENTITY: '-'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Configure TAURI_SIGNING_PRIVATE_KEY before releasing'; exit 1; }
          npm run tauri build -- --target universal-apple-darwin --bundles app --config src-tauri/tauri.updater.conf.json

      - name: Run regression tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Verify architectures and bundle version
        run: |
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/screen-buoy.app
          lipo "$APP/Contents/MacOS/screen-buoy" -verify_arch arm64 x86_64
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "${GITHUB_REF_NAME#v}"
          codesign --verify --deep --strict "$APP"

      - name: Create screen-buoy-macos.zip
        run: |
          ditto -c -k --keepParent src-tauri/target/universal-apple-darwin/release/bundle/macos/screen-buoy.app screen-buoy-macos.zip
          cp src-tauri/target/universal-apple-darwin/release/bundle/macos/screen-buoy.app.tar.gz screen-buoy-macos.app.tar.gz
          cp src-tauri/target/universal-apple-darwin/release/bundle/macos/screen-buoy.app.tar.gz.sig screen-buoy-macos.app.tar.gz.sig

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            screen-buoy-macos.zip
            screen-buoy-macos.app.tar.gz
            screen-buoy-macos.app.tar.gz.sig
          if-no-files-found: error

  prepare-release:
    needs: [release-windows, release-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout manifest generator
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download both platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Generate complete update manifest and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          node --test scripts/create-update-manifest.test.mjs
          node scripts/create-update-manifest.mjs . "$RELEASE_TAG" "$RELEASE_REPOSITORY"
          sha256sum screen-buoy-macos.zip screen-buoy-windows.zip screen-buoy-macos.app.tar.gz screen-buoy-windows-setup.exe latest.json > SHA256SUMS

      - name: Create complete draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            screen-buoy-macos.zip
            screen-buoy-windows.zip
            screen-buoy-macos.app.tar.gz
            screen-buoy-macos.app.tar.gz.sig
            screen-buoy-windows-setup.exe
            screen-buoy-windows-setup.exe.sig
            latest.json
            SHA256SUMS
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
