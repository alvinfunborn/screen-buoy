<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overlay</title>
    <style>
        html {
            background: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0);
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            pointer-events: auto;
            position: fixed;
            top: 0;
            left: 0;
        }

        .hints-container {
            position: absolute;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
        }

        .hint.visible {
            display: block;
            opacity: 1;
        }

        .hint.filtered {
            display: none;
            opacity: 0;
        }
    </style>
</head>

<body>
    <div class="hints-container" id="hintsContainer">
        <!-- hints will be added here -->
    </div>
    <script type="module">
        // import { invoke } from "@tauri-apps/api/tauri"; // v1
        import { invoke } from "@tauri-apps/api/core"; // v2
        import { HintState } from "./src/overlay/hint-state.js";
        const hintState = new HintState();
        import { getCurrentWebview } from "@tauri-apps/api/webview";

        // 使用导入的 API 直接获取当前窗口
        const currentWindow = getCurrentWebview();

        // 创建提示元素
        function createHintElement(hint) {
            try {
                if (!hint || typeof hint !== 'object') {
                    throw new Error('Invalid hint data');
                }

                const { x, y, z, text, hint_type } = hint;

                const hintElement = document.createElement('div');
                hintElement.className = 'hint visible hint-style' + hint.hint_type;
                hintElement.dataset.code = text;
                applyFilter(hintElement);

                // 直接使用相对坐标
                hintElement.style.left = x + 'px';
                hintElement.style.top = y + 'px';
                hintElement.style.zIndex = z;
                return hintElement;
            } catch (error) {
                console.error(`[createHintElement] window: ${currentWindow.label} Error creating hint element: ${error.message}`);
                return null;
            }
        }

        // 清除提示
        function clearHints() {
            const container = document.getElementById('hintsContainer');
            container.innerHTML = '';
            container.style.transform = 'translate(0px, 0px)';
        }

        // 移动提示
        function moveHints(x, y) {
            const container = document.getElementById('hintsContainer');
            const currentTransform = container.style.transform || 'translate(0px, 0px)';
            const [currentX, currentY] = currentTransform
                .match(/translate\((-?\d+)px,\s*(-?\d+)px\)/)
                ?.slice(1)
                .map(Number) || [0, 0];

            container.style.transform = `translate(${currentX + x}px, ${currentY + y}px)`;
        }

        function applyFilter(element) {
            const { visible, text } = hintState.display(element.dataset.code);
            element.classList.toggle('filtered', !visible);
            element.textContent = text;
        }

        function filterHints() {
            document.querySelectorAll('.hint').forEach(applyFilter);
        }

        // 获取hint默认样式配置
        async function getHintDefaultStyle() {
            try {
                const style = await invoke('get_hint_default_style');
                return style;
            } catch (error) {
                console.error(`[getHintDefaultStyle] window: ${currentWindow.label} failed to get hint default style: ${error}`);
                return null;
            }
        }
        // 获取hint样式配置
        async function getHintTypesStyles() {
            try {
                const styles = await invoke('get_hint_types_styles');
                return styles;
            } catch (error) {
                console.error(`[getHintTypesStyles] window: ${currentWindow.label} failed to get hint types styles: ${error}`);
                return null;
            }
        }

        // 生成默认css
        function generateHintDefaultStyle(style) {
            return `.hint ${style}`
        }

        // 生成自定义css
        function generateHintTypesStyles(styles) {
            let css = ``;
            for (let i = 0; i < styles.length; i++) {
                css += `
                .hint-style${i} ${styles[i]}`;
            }

            return css;
        }

        // 应用样式到页面
        function applyStyles(css) {
            const styleElement = document.createElement('style');
            styleElement.textContent = css;
            document.head.appendChild(styleElement);
            console.log(`[applyStyles] window: ${currentWindow.label} hint styles applied`);
        }

        // 主初始化函数
        async function initialize() {
            try {
                // 获取并应用样式
                const style = await getHintDefaultStyle();
                if (style) {
                    const css = generateHintDefaultStyle(style);
                    applyStyles(css);
                }
                const styles = await getHintTypesStyles();
                if (styles) {
                    const css = generateHintTypesStyles(styles);
                    applyStyles(css);
                }

                const unlistenShow = await currentWindow.listen('show-hints', ({ payload }) => {
                    if (payload.windowLabel === currentWindow.label && hintState.begin(payload.session)) {
                        clearHints();
                    }
                });
                const unlistenShow2 = await currentWindow.listen('append-hints', ({ payload }) => {
                    if (payload.windowLabel !== currentWindow.label || !Array.isArray(payload.hints)) return;
                    const fragment = document.createDocumentFragment();
                    for (const hint of hintState.append(payload.session, payload.hints)) {
                        const element = createHintElement(hint);
                        if (element) fragment.appendChild(element);
                    }
                    document.getElementById('hintsContainer').appendChild(fragment);
                });
                const unlistenHide = await currentWindow.listen('hide-hints', ({ payload }) => {
                    if (hintState.hide(payload.session)) clearHints();
                });
                const unlistenMove = await currentWindow.listen('move-hints', ({ payload }) => {
                    if (hintState.active && payload.session === hintState.session) moveHints(payload.x, payload.y);
                });
                const unlistenFilter = await currentWindow.listen('filter-hints', ({ payload }) => {
                    if (hintState.filter(payload.session, payload.revision, payload.letters)) filterHints();
                });

                // 设置清理函数
                window.addEventListener('unload', () => {
                    try {
                        unlistenShow();
                        unlistenShow2();
                        unlistenHide();
                        unlistenMove();
                        unlistenFilter();
                        console.log(`[cleanup] window: ${currentWindow.label} listeners cleaned`);
                    } catch (error) {
                        console.error(`[cleanup] window: ${currentWindow.label} failed to clean listeners: ${error}`);
                    }
                });

            } catch (error) {
                console.error(`[initialize] window: ${currentWindow.label} failed to set listeners: ${error}`);
            }

            // 错误处理
            window.addEventListener('error', (event) => {
                console.error(`[initialize] window: ${currentWindow.label} caught global error: ${event.error}`);
            });

            window.addEventListener('unhandledrejection', (event) => {
                console.error(`[initialize] window: ${currentWindow.label} caught unhandled rejection: ${event.reason}`);
            });
        }

        // 等待 DOM 加载完成后再初始化
        document.addEventListener('DOMContentLoaded', () => {
            initialize().catch(error => {
                console.error(`[initialize] failed: ${error}`);
            });
        });
    </script>
</body>

</html>
